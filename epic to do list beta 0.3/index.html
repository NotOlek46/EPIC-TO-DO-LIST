<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC TO DO LIST</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="function.css">
    <link rel="stylesheet" href="dark.css" id="xtheme">
</head>
<body>
    <div id="mainblock">
        <div class="title">
            <h1 id="mainh1">EPIC TO DO LIST</h1>
            <h4 id="randomtext"></h4>
        </div>    
        <div id="taskbox">
            <div id="newtask">
                <input type="text" placeholder="New task description">
                <button onclick="addTask()" class="j">Add task</button>
            </div>

            <div id="tasks">
                <ul>

                </ul>
            </div>
        </div>    
    </div>
    <div id="bottomblock">
        <button style="cursor: pointer;" type="submit" id="settingsbtn" onclick="displaySettings()">Settings</button>
    </div>
    <div id="settingscontainer">
        <div id="settings">
            <h1 style="color: snow" id="settingsheadline">Settings</h1>
            <label for="lang"><h3 id="langheadline">Language</h3><br>
                <select name="langs" id="languages">
                    <option value="eng">English</option>
                    <option value="pol">Polski</option>
                    <option value="ger">Deutsch</option>
                </select>
            </label>
            <label for="them"><h3 id="themeheadline">Theme</h3><br>
                <select name="them" id="themeSelector">
                    <option value="dark.css">Dark</option>
                    <option value="light.css">Light</option>
                    <option value="aet.css">aetehs</option>
                    <option value="galaxy.css">Galaxy</option>
                    <option value="orange.css">Orange juice</option>
                    <option value="winter.css">Winter sky</option>
                </select>
            </label>
            <br>
            <button style="margin-top: 50px;" onclick="undisplaySettings()">Close</button>
        </div>
    </div>
    <script src="themes.js"></script>
    <script src="settings.js"></script>
    <script src="task.js"></script>
    <script src="rndtext.js"></script>
    <!--<script src="lang.js"></script> wsparcie dla innych języków jest tymczasowo niedostępne-->
</body>
</html>
