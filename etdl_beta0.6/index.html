<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC TO DO LIST</title>
    <link rel="preload" href="IosevkaTerm-Regular.woff2" as="font" type="woff2" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="function.css">
    
    <script>
        (function () {
            var themes = ['dark.css', 'light.css', 'aet.css', 'catppuccin.css', 'rosepine.css', 'galaxy.css', 'orange.css', 'winter.css', 'rampage.css'];
            var theme = 'dark.css';
            try {
                var saved = localStorage.getItem('userTheme');
                if (themes.includes(saved)) {
                    theme = saved;
                } else {
                    theme = 'dark.css';
                }
            } catch {}
            document.write('<link rel="stylesheet" href="' + theme + '" id="xtheme">');
        })();
        // to musi tu byc bo inaczej sie rozjebie
    </script>
    <script>checkLanguage();</script>
    <!--niezwkły skrypt-->

</head>
<body>
    <div id="filter"></div>

    <div id="mainblock">
        <div class="title">
            <h1 id="mainh1">EPIC TO DO LIST</h1>
            <h4 id="randomtext"></h4>
        </div>    
        <div id="taskbox">
            <div id="newtask">
                <input type="text" placeholder="New task description" id="taskinput">
                <button onclick="addTask()" class="j">Add task</button>
            </div>

            <div id="tasks">
                <ul>

                </ul>
            </div>
        </div>    
    </div>
    <div id="bottomblock">
        <button style="cursor: pointer;" type="submit" id="settingsbtn" onclick="displaySettings()"></button>
    </div>

    <div id="settingscontainer">
        <div id="settings">
            <h1 id="settingsheadline">Settings</h1>
            <label for="lang"><h3 id="langheadline" style="margin-bottom: -2%">Language</h3><br>
                <select name="langs" id="languages">
                    <option value="eng">English</option>
                    <option value="pol">Polski</option>
                    <option value="ger">Deutsch</option>
                    <option value="jap">日本語</option>
                </select>
            </label>
            <hr class="sep">
            <label for="them"><h3 id="themeheadline" style="margin-bottom: -2%">Theme</h3><br>
                <select name="them" id="themeSelector">
                    <optgroup label="Default">
                        <option value="dark.css">Dark</option>
                        <option value="light.css">Light</option>
                    </optgroup>
                    <optgroup label="Custom">
                        <option value="aet.css">aetehs</option>
                        <option value="catppuccin.css">Catppuccin Mocha</option>
                        <option value="rosepine.css">Rose Pine</option>
                        <option value="galaxy.css">Galaxy</option>
                        <option value="orange.css">Orange juice</option>
                        <option value="winter.css">Winter sky</option>
                        <option value="rampage.css">Inhuman Rampage</option>
                    </optgroup>    
                </select>
            </label>
            <br>
            <button style="margin-top: 35px;" onclick="undisplaySettings()">Close</button>
        </div>
    </div>
    <script src="themes.js"></script>
    <script src="settings.js"></script>
    <script src="task.js"></script>
    <script src="rndtext.js"></script> 
    <script src="lang.js"></script>
</body>
</html>
