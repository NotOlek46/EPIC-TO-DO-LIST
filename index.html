<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC TO DO LIST</title>
    <link rel="preload" href="FONTS/IosevkaTerm-Regular.woff2" as="font" type="woff2" crossorigin>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/function.css">
    
    <script>
        (function () {
            var themes = ['CSS/dark.css', 'CSS/light.css', 'CSS/aet.css', 'CSS/catppuccin.css', 'CSS/rosepine.css', 'CSS/galaxy.css', 'CSS/orange.css', 'CSS/winter.css', 'CSS/rampage.css', 'CSS/autumn.css'];
            var theme = 'CSS/dark.css';
            try {
                var saved = localStorage.getItem('userTheme');
                if (themes.includes(saved)) {
                    theme = saved;
                } else {
                    theme = 'CSS/dark.css';
                }
            } catch {}
            document.write('<link rel="stylesheet" href="' + theme + '" id="xtheme">');
        })();
        // to musi tu byc bo inaczej sie rozjebie
    </script>
    <script>
        checkLanguage();
    </script>
    <script>
        roundedCheck();
    </script>
    <!--kontynuacja super skryptu-->

</head>
<body>
    <div id="filter"></div>

    <div id="mainblock">
        <div class="title">
            <h1 id="mainh1">EPIC TO DO LIST</h1>
            <h4 id="randomtext"></h4>
        </div>    
        <div id="taskbox">
            <div id="newtask">
                <input type="text" placeholder="New task description" id="taskinput">
                <button onclick="addTask()" class="j">Add task</button>
            </div>

            <div id="tasks" class="tasks-round">
                <ul>

                </ul>
            </div>
        </div>    
    </div>
    <div id="bottomblock">
        <button style="cursor: pointer;" type="submit" id="settingsbtn" onclick="displaySettings()"></button>
    </div>

    <div id="settingscontainer">
        <div id="settings">
            <h1 id="settingsheadline">Settings</h1>
            <label for="lang"><h3 id="langheadline" style="margin-bottom: -2%">Language</h3><br>
                <select name="langs" id="languages">
                    <option value="eng">English</option>
                    <option value="pol">Polski</option>
                    <option value="ger">Deutsch</option>
                    <option value="jap">日本語</option>
                </select>
            </label>
            <hr class="sep">
            <label for="them"><h3 id="themeheadline" style="margin-bottom: -2%">Theme</h3><br>
                <select name="them" id="themeSelector">
                    <optgroup label="Default">
                        <option value="CSS/dark.css">Dark</option>
                        <option value="CSS/light.css">Light</option>
                    </optgroup>
                    <optgroup label="Custom">
                        <option value="CSS/aet.css">aetehs</option>
                        <option value="CSS/catppuccin.css">Catppuccin Mocha</option>
                        <option value="CSS/rosepine.css">Rose Pine</option>
                        <option value="CSS/galaxy.css">Galaxy</option>
                        <option value="CSS/orange.css">Orange juice</option>
                        <option value="CSS/winter.css">Winter sky</option>
                        <option value="CSS/rampage.css">Inhuman Rampage</option>
                        <option value="CSS/autumn.css">Autumn leaves</option>
                    </optgroup>    
                </select>
            </label>
            <br>
            <!--<label for="rounded"><input type="checkbox" id="round" name="check1" onclick="roundedCheck()"><span id="roundpar">Rounded edges</span></label>-->
            <br>
            <button style="margin-top: 5px;" onclick="undisplaySettings()">Close</button>
        </div>
    </div>
    <script src="JS/themes.js"></script>
    <script src="JS/settings.js"></script>
    <script src="JS/task.js"></script>
    <script src="JS/rndtext.js"></script> 
    <script src="JS/lang.js"></script>
    <!--<script src="JS/edges.js" defer></script>-->
</body>
</html>
